const sun = new THREE.DirectionalLight(K ? '#c9d4e6' : G ? '#ffc28a' : '#ffe9cc', K ? 1.1 : G ? 4.6 : 3.2); sun.position.copy(SUNDIR).multiplyScalar(700); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -420, right: 420, top: 420, bottom: -420, near: 10, far: 1800 }); sun.shadow.bias = -.0005; sun.shadow.radius = K ? 14 : 10; sun.shadow.blurSamples = 20; scene.add(sun);
if (K) { const lens = new THREE.MeshBasicMaterial({ color: new THREE.Color('#ffd9a8').multiplyScalar(1.3), toneMapped: false }); LAMPS.forEach(([p, s], i) => { add(new THREE.CircleGeometry(.28, 12), lens, p.x, p.y - .2, p.z).rotation.x = Math.PI / 2;
  const sp = new THREE.SpotLight('#ffbf7a', 520, 40, 1.0, 1.0, 2); sp.position.copy(p); sp.target.position.set(p.x, DECKY, p.z - s * 3); if (i === 7 || i === 12) { sp.castShadow = true; sp.shadow.mapSize.set(512, 512); sp.shadow.radius = 10; sp.shadow.blurSamples = 16; } scene.add(sp, sp.target); }); }
const post = makePost(r, scene, cam, W, H, { ssaa: SS, ao: true, aoAmt: .7, aoRadius: 3, aoScale: 1.3 });
post.bloom.strength = K ? .12 : .1; post.bloom.threshold = 1.6; post.vig.uniforms.amt.value = K ? .3 : .35; post.vig.uniforms.contrast.value = 0.;
SC.post = post; SC.sun = sun;

// ── HUD: neo labels (short line + uppercase) and big numbers; rule: a frame gets a label OR a number ─────
const hud = document.createElement('canvas'); hud.width = W; hud.height = H; Object.assign(hud.style, { position: 'fixed', left: 0, top: 0, width: '100%', height: 'auto', pointerEvents: 'none' }); document.body.appendChild(hud);
const scr = p => { const v = p.clone().project(cam); return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H, v.z < 1]; };
function label(wp, text, dx = 1, gap = 40) { const x = hud.getContext('2d'), k = H / 1080; const [px, py, ok] = scr(wp); if (!ok) return; const sx = px + dx * gap * k; x.save(); x.strokeStyle = 'rgba(255,255,255,.9)'; x.fillStyle = '#fff'; x.lineWidth = 1.5 * k;
  x.beginPath(); x.moveTo(sx, py); x.lineTo(sx + dx * 34 * k, py); x.stroke(); x.font = `500 ${30 * k}px Inter, "Helvetica Neue", Arial`; x.letterSpacing = `${1 * k}px`; x.textBaseline = 'middle'; x.textAlign = dx > 0 ? 'left' : 'right'; x.fillText(text.toUpperCase(), sx + dx * 46 * k, py); x.restore(); }
const LB = { pier: () => V3(P17, 30, 26), dali: () => { const b = new THREE.Box3().setFromObject(SC.wrap || ship), c = b.getCenter(V3()); return V3(c.x, b.max.y + 4, c.z); }, bridge: () => V3(60, DECKY + topH(60) + 3, 12) };
window.big = (num, unit, sub, x0 = .06, y0 = .86, grad = true) => { const x = hud.getContext('2d'), k = H / 1080, X = W * x0, Y0 = H * y0; x.save(); if (grad) { const gr = x.createLinearGradient(0, H * .55, 0, H); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.42)'); x.fillStyle = gr; x.fillRect(0, H * .55, W, H * .45); }
  x.fillStyle = '#fff'; x.shadowColor = 'rgba(0,0,0,.35)'; x.shadowBlur = 8 * k; x.font = '600 ' + 150 * k + 'px Inter, "Helvetica Neue", Arial'; x.fillText(num, X, Y0); const w = x.measureText(num).width; x.font = '400 ' + 48 * k + 'px Inter, "Helvetica Neue", Arial'; x.fillText(unit.toUpperCase(), X + w + 22 * k, Y0); x.font = '400 ' + 26 * k + 'px Inter, "Helvetica Neue", Arial'; x.globalAlpha = .85; x.fillText(sub.toUpperCase(), X + 4 * k, Y0 + 48 * k); x.restore(); return 'ok'; };
// shot(pos, target, fov, aperture, labels, focusPoint?) — DOF on by default (neo look)
window.shot = (pos, tgt, fov = 30, aper = 2.5, labels = [], focus) => { cam.position.set(...pos); cam.fov = fov; cam.lookAt(...tgt); cam.updateProjectionMatrix(); water.material.uniforms.time.value = 4.0;
  post.dof.focus = cam.position.distanceTo(V3(...(focus || tgt))); post.dof.aper = aper; post.dof.maxCoc = aper ? 8 : 0; post.composer.render();
  hud.getContext('2d').clearRect(0, 0, W, H); for (const [k, t, dx, gap] of labels) label(LB[k](), t, dx, gap); return 'ok'; };
window.READY = true;
</script></body></html>
