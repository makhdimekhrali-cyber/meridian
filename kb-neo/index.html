  const show = t => { window.render(t); const sh = SH.find(q => t < q.b) || SH[SH.length - 1]; tl.textContent = t.toFixed(1) + ' с · ' + sh.k; };
  b.onclick = () => { playing = !playing; b.textContent = playing ? '❚❚' : '▶'; if (playing) { w0 = +sl.value; t0 = performance.now(); if (au.src) { au.currentTime = w0; au.play(); } } else au.pause(); };
  sl.oninput = () => { if (playing) b.onclick(); show(+sl.value); };
  const loop = () => { if (playing) { const t = cur(); if (t >= 49.5) b.onclick(); else { sl.value = t; show(t); } } requestAnimationFrame(loop); }; loop(); show(0); };
setTimeout(() => window.PLAYER(), 300);
window.READY = true;
</script></body></html>
