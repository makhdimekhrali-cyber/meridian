const qs = new URLSearchParams(location.search);
const W = window.RW || 1920, H = window.RH || 1080, K = H / 1080;

// ───────── renderer ─────────

// side-profile extrusion: pts in (x, y), extruded along z, centred; bevelled edges
function profile(pts, depth, bevel = .05) { const sh = new THREE.Shape(); pts.forEach((p, i) => { if (p.length === 4) sh.quadraticCurveTo(p[0], p[1], p[2], p[3]); else sh[i ? 'lineTo' : 'moveTo'](p[0], p[1]); });

function canvasTex(w, h, draw, srgb = true) { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; draw(cv.getContext('2d'), w, h); const t = new THREE.CanvasTexture(cv); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; }

const water = new Water(new THREE.PlaneGeometry(40000, 40000), { textureWidth: 1536, textureHeight: 1536, waterNormals, sunDirection: V(-.4, .7, -.5).normalize(), sunColor: '#141a24', waterColor: '#061019', distortionScale: 1.1, fog: true });

// ── land: two shores, trees, warehouses, port cranes, city skyline ──
const GROUND = STD('#1c2024', .95);

{ // trees
  const g = new THREE.IcosahedronGeometry(1, 1), im = new THREE.InstancedMesh(g, STD('#1b261d', .95), 900), m = new THREE.Matrix4(); let k = 0;
  for (let i = 0; i < 900; i++) { const s = rnd() < .5 ? -1 : 1, x = s * (1340 + rnd() * 1500), z = -900 + rnd() * 2800; if (Math.abs(z) < 30) continue; const r = 4 + rnd() * 5;
    m.compose(V(x, 6 + r * .8, z), new THREE.Quaternion(), V(r, r * 1.2, r)); im.setMatrixAt(k++, m); }
  im.count = k; im.castShadow = false; im.receiveShadow = true; world.add(im);
}
const winTex = canvasTex(256, 512, (c, w, h) => { c.fillStyle = '#000'; c.fillRect(0, 0, w, h); for (let y = 6; y < h; y += 14) for (let x = 6; x < w; x += 12) { const v = hash(x * 3.1 + y * 7.7); if (v > .62) { c.fillStyle = v > .93 ? '#ffe9c4' : v > .8 ? '#ffc98a' : '#c8d6ff'; c.globalAlpha = .4 + .6 * hash(x + y); c.fillRect(x, y, 6, 7); } } c.globalAlpha = 1; });
{ // warehouses near both shores + city skyline far across the harbour
  const geo = new THREE.BoxGeometry(1, 1, 1), mat = STD('#2a2e33', .9, 0, { emissive: '#ffffff', emissiveMap: winTex, emissiveIntensity: .9 });
  const list = [];
  for (let i = 0; i < 70; i++) { const s = rnd() < .5 ? -1 : 1; list.push([s * (1500 + rnd() * 1800), 6, -700 + rnd() * 2400, 30 + rnd() * 60, 8 + rnd() * 10, 20 + rnd() * 50]); }
  for (let i = 0; i < 220; i++) { const x = -5200 + rnd() * 6000, z = 6500 + rnd() * 3500, h = 15 + Math.pow(rnd(), 2.2) * (x > -2600 && x < -800 ? 190 : 70); list.push([x, 6, z, 30 + rnd() * 50, h, 30 + rnd() * 50]); }
  const im = new THREE.InstancedMesh(geo, mat, list.length), m = new THREE.Matrix4();
  list.forEach(([x, y, z, w, h, d], i) => { m.compose(V(x, y + h / 2, z), new THREE.Quaternion(), V(w, h, d)); im.setMatrixAt(i, m); }); im.receiveShadow = true; world.add(im);
}
const craneMat = STD('#8f3a2c', .7, .2), redLight = EM('#ff2a1a', 6);
for (let i = 0; i < 6; i++) { // ship-to-shore cranes at the terminal (silhouettes)
  const x = -2600 + i * 120, z = 2180, L = [];
  for (const dx of [-9, 9]) for (const dz of [-6, 6]) L.push([V(x + dx, 5, z + dz), V(x + dx, 52, z + dz), 1.6]);
  L.push([V(x - 9, 52, z - 6), V(x + 9, 52, z - 6), 1.6], [V(x - 9, 52, z + 6), V(x + 9, 52, z + 6), 1.6], [V(x, 56, z + 30), V(x, 56, z - 70), 2.2], [V(x, 52, z), V(x, 78, z), 1.4], [V(x, 78, z), V(x, 57, z - 60), .6], [V(x, 78, z), V(x, 57, z + 28), .6]);
  beams(L, craneMat, world, false); mesh(new THREE.SphereGeometry(1, 8, 6), redLight, world, x, 79, z, false);

// ── the bridge (approximate: main span 1,200 ft between piers 17/18, continuous through-truss, approaches) ──
const P17 = -183, ANCH = 402, END = 1300, DECKY = 56;
const deckY = x => { const a = Math.abs(x); return a <= ANCH ? DECKY : DECKY - 44 * Math.pow(clamp((a - ANCH) / (END - ANCH)), 1.15); };
const topH = x => { const a = Math.abs(x); return a < 183 ? 26 + 24 * Math.pow(a / 183, 2) : 2 + 48 * Math.pow(Math.max(0, 1 - (a - 183) / 219), 1.25); };
const LAMP = { uLamp: { value: 1 }, uPol: { value: new THREE.Vector4(0, 0, 0, 0) }, uWork: { value: 1 } };

  sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vWP;').replace('#include <begin_vertex>', '#include <begin_vertex>\nvWP=(modelMatrix*vec4(transformed,1.)).xyz;');

    .replace('#include <color_fragment>', `#include <color_fragment>
    float top = step(.5, vNormal.y);
    float ln = step(abs(abs(vWP.z)-3.6),.07) * step(mod(vWP.x, 12.), 4.) + step(abs(abs(vWP.z)-9.6),.08);
    float yl = step(abs(vWP.z), .16) * step(.08, abs(vWP.z));
    float gr = .9 + .12*hh(floor(vWP.xz*60.)) + .06*sin(vWP.x*.7+sin(vWP.z*1.3)*2.)*sin(vWP.z*.9);
    diffuseColor.rgb = mix(diffuseColor.rgb * gr, vec3(.42), clamp(ln,0.,1.)*top);
    diffuseColor.rgb = mix(diffuseColor.rgb, vec3(.55,.4,.08), yl*top);`)
    .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
    float m = mod(vWP.x + 25., 50.) - 25.;
    float pool = exp(-m*m/(2.*8.*8.)) * (exp(-pow(vWP.z-9.,2.)/30.) + exp(-pow(vWP.z+9.,2.)/30.));
    totalEmissiveRadiance += vec3(1.,.7,.45) * pool * .025 * uLamp * diffuseColor.rgb * 3.;
    float wz = exp(-pow((vWP.x-100.)/32.,2.)) * exp(-pow((vWP.z-5.)/6.,2.));
    totalEmissiveRadiance += vec3(1.,.85,.62) * wz * .5 * uWork * diffuseColor.rgb * 3.;
    for (int i=0;i<2;i++){ float px = i==0 ? uPol.x : -uPol.x; float d = length(vec2(vWP.x-px, vWP.z));
      float f = exp(-d*d/(2.*8.*8.)); vec3 c = (i==0 ? uPol.y : uPol.z) > .5 ? vec3(1.,.1,.06) : vec3(.12,.25,1.);
      totalEmissiveRadiance += c * f * uPol.w; }`);
};
{
  const pos = [], idx = []; let n = 0;
  const uvs = [];
  for (let x = -END - 40; x <= END + 40; x += 4) { const y = deckY(clamp(x, -END, END)) + .1; pos.push(x, y, -11, x, y, 11, x, y - 2.2, -11, x, y - 2.2, 11); uvs.push(x / 5, -11 / 5, x / 5, 11 / 5, x / 5, -11 / 5, x / 5, 11 / 5); n++; }
  for (let i = 0; i < n - 1; i++) { const a = i * 4, b = a + 4; idx.push(a, a + 1, b, a + 1, b + 1, b); idx.push(a + 2, b + 2, a, a, b + 2, b); idx.push(a + 1, b + 1, a + 3, a + 3, b + 1, b + 3); idx.push(a + 2, a + 3, b + 2, a + 3, b + 3, b + 2); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2)); mesh(g, deckMat, world);
  // jersey barriers along both edges (follow the deck)
  const L = []; for (let x = -END; x < END; x += 8) for (const z of [-10.7, 10.7]) L.push([V(x, deckY(x) + .45, z), V(x + 8, deckY(x + 8) + .45, z), .5, .9]);
  const jg = (() => { const sh = new THREE.Shape(); sh.moveTo(-.3, 0); sh.lineTo(-.3, .08); sh.lineTo(-.18, .25); sh.lineTo(-.09, .9); sh.lineTo(.09, .9); sh.lineTo(.18, .25); sh.lineTo(.3, .08); sh.lineTo(.3, 0);

  const bar = new THREE.InstancedMesh(jg, STD('#9c9a94', .9), L.length), m = new THREE.Matrix4(), q = new THREE.Quaternion();
  L.forEach(([a, b], i) => { const d = b.clone().sub(a), l = d.length(); q.setFromUnitVectors(V(1, 0, 0), d.clone().normalize()); m.compose(a.clone().add(b).multiplyScalar(.5), q, V(l, 1, 1)); bar.setMatrixAt(i, m); });
  bar.receiveShadow = true; world.add(bar); window._bar = bar;
}
const STEEL = STD('#8a948f', .62, .35);
const IBEAM = (() => { const sh = new THREE.Shape(), f = .16, w = .14; sh.moveTo(-.5, -.5); sh.lineTo(.5, -.5); sh.lineTo(.5, -.5 + f); sh.lineTo(w / 2, -.5 + f); sh.lineTo(w / 2, .5 - f); sh.lineTo(.5, .5 - f); sh.lineTo(.5, .5); sh.lineTo(-.5, .5); sh.lineTo(-.5, .5 - f); sh.lineTo(-w / 2, .5 - f); sh.lineTo(-w / 2, -.5 + f); sh.lineTo(-.5, -.5 + f); sh.closePath();
  const g = new THREE.ExtrudeGeometry(sh, { depth: 1, bevelEnabled: false }); g.translate(0, 0, -.5); g.rotateX(Math.PI / 2); g.computeVertexNormals(); return g; })();
const CONC = STD('#a8a69f', .92);
{
  const L = [], NP = 48, dx = 2 * ANCH / NP;
  for (const z of [-11.3, 11.3]) for (let i = 0; i < NP; i++) {

  for (const x of [P17, -P17]) { mesh(BOX(14, DECKY + 4, 34), CONC, world, x, DECKY / 2 - 3.5, 0); mesh(BOX(22, 5, 46), CONC, world, x, 1, 0); }
  for (const x of [-ANCH, ANCH]) mesh(BOX(10, DECKY, 26), CONC, world, x, DECKY / 2 - 2.5, 0);
  // street lights every 50 m: pole + arm + sodium head

  for (let x = -END + 25; x < END; x += 50) for (const z of [-10.9, 10.9]) { const y = deckY(x); P.push([V(x, y, z), V(x, y + 11, z), .22], [V(x, y + 11, z), V(x, y + 11, z * .78), .16]); heads.push(V(x, y + 10.9, z * .78)); }
  beams(P, STD('#5d6460', .6, .4), world, false, new THREE.CylinderGeometry(.5, .5, 1, 12));
  const hm = new THREE.InstancedMesh(new THREE.CapsuleGeometry(.22, .9, 6, 12).rotateZ(Math.PI / 2), EM('#ffd9ae', 3.2), heads.length), m4 = new THREE.Matrix4();
  heads.forEach((p, i) => { m4.makeTranslation(p.x, p.y, p.z); hm.setMatrixAt(i, m4); }); world.add(hm); window._heads = heads;

}

// ── vehicles ──
const glass = STD('#0b0f14', .12, .6);
const rubber = STD('#141414', .9);

function wheels(g, xs, z, r = .38) { for (const x of xs) for (const s of [-1, 1]) {
  const t = mesh(new THREE.TorusGeometry(r - .1, .11, 16, 32), rubber, g, x, r, s * z); t.scale.z = 1.2;
  const rim = mesh(new THREE.CylinderGeometry(r - .13, r - .13, .2, 28).rotateX(Math.PI / 2), rimM, g, x, r, s * z); } }

// ───────── capture: render(t) → WebCodecs H.264 → mp4 → download ─────────
import { Muxer, ArrayBufferTarget } from 'mp4-muxer';
window.CAPTURE = async (from, to, fps = 24, name = 'hook.mp4', sub = 1) => {
  const comp = document.createElement('canvas'); comp.width = W; comp.height = H; const cx = comp.getContext('2d');
  const target = new ArrayBufferTarget();
  const muxer = new Muxer({ target, video: { codec: 'avc', width: W, height: H, frameRate: fps }, fastStart: 'in-memory' });
  const enc = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: e => { window.CAPERR = String(e); } });
  enc.configure({ codec: 'avc1.640033', width: W, height: H, bitrate: 40e6, framerate: fps, latencyMode: 'quality' });
  window.PROG = { from, to, f: from, t0: performance.now() };
  for (let f = from; f < to; f++) {
    if (sub > 1) { // motion blur: average sub-frames across a 180° shutter
      cx.clearRect(0, 0, W, H); cx.globalAlpha = 1;
      for (let s = 0; s < sub; s++) { window.render((f + (s / sub - .5) * .5) / fps); cx.globalAlpha = 1 / (s + 1); cx.drawImage(glc, 0, 0, W, H); }
      cx.globalAlpha = 1; window.render(f / fps); cx.clearRect(0, 0, 0, 0);
      // overlay only the HUD from the centre sub-frame
      cx.drawImage(hud, 0, 0);
    } else { window.render(f / fps); cx.clearRect(0, 0, W, H); cx.drawImage(glc, 0, 0, W, H); cx.drawImage(hud, 0, 0); }
    const vf = new VideoFrame(comp, { timestamp: Math.round((f - from) * 1e6 / fps), duration: Math.round(1e6 / fps) });
    enc.encode(vf, { keyFrame: (f - from) % 48 === 0 }); vf.close();
    if (enc.encodeQueueSize > 8) await new Promise(r => enc.addEventListener('dequeue', r, { once: true }));
    window.PROG.f = f + 1;
    if (f % 6 === 0) await new Promise(r => setTimeout(r, 0));
  }
  await enc.flush(); muxer.finalize();
  const blob = new Blob([target.buffer], { type: 'video/mp4' }); window.LASTBLOB = blob;
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  window.PROG.done = true; window.PROG.bytes = blob.size; window.PROG.sec = (performance.now() - window.PROG.t0) / 1000;
};
