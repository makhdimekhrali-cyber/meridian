<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/","/core/three/post.js":"./core/three/post.js"}}</script></head><body>
<script type="module">
// Key Bridge, 1:24 a.m. — road crew on the centre span. Kaktus-style diorama: a cut-out slab of the bridge floating in black,
// real scanned materials (Poly Haven CC0), faceted mannequin people, soft night light (sodium lamps + one work light + cool moon).
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { makePost } from '/core/three/post.js';
const W = window.RW || innerWidth, H = window.RH || innerHeight, A = 'kd/';
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(W, H); r.domElement.style.width = '100%'; r.domElement.style.height = 'auto'; document.body.appendChild(r.domElement);
r.toneMapping = THREE.AgXToneMapping; r.toneMappingExposure = 1.0; r.shadowMap.enabled = true; r.shadowMap.type = THREE.VSMShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#0a0c0f'); scene.fog = new THREE.Fog('#0a0c0f', 70, 220);
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), .04).texture; scene.environmentIntensity = .32;
const cam = new THREE.PerspectiveCamera(30, W / H, .1, 600);
const TL = new THREE.TextureLoader();
function tex(name, rep = [1, 1], srgb = false) { const t = TL.load(A + 'tex/' + name); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep); t.anisotropy = 8; if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t; }
function pbr(base, rep, o = {}) { return new THREE.MeshStandardMaterial({ map: tex(base + '_diff.jpg', rep, true), normalMap: tex(base + '_nor.jpg', rep), roughnessMap: tex(base + '_rough.jpg', rep), ...o }); }
const add = (g, m, x = 0, y = 0, z = 0, p = scene) => { const o = new THREE.Mesh(g, m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; p.add(o); return o; };

// ── slab: 84 m of the centre span, 4 lanes (2 each way) ─────────────────────
const L = 84, HW = 9.2, TH = 1.3;
const ASPH = pbr('asphalt_02', [L / 6, 2 * HW / 6], { color: '#8d8d8d' });
const CONC = pbr('concrete_wall_006', [L / 8, 1], { color: '#9a9893' });
const deck = add(new THREE.BoxGeometry(L, TH, 2 * HW), [CONC, CONC, ASPH, CONC, CONC, CONC], 0, -TH / 2, 0);
// stringers and floor beams under the slab (seen on the cut edges and from low angles)
const STEEL = pbr('green_metal_rust', [1, 4], { color: '#6f7b78', metalness: .5, roughness: .7 });
for (let z = -HW + 1; z <= HW - 1; z += 2.4) add(new THREE.BoxGeometry(L, .9, .35), STEEL, 0, -TH - .45, z);
for (let x = -L / 2 + 3; x < L / 2; x += 10.5) add(new THREE.BoxGeometry(.5, 1.4, 2 * HW + 2), STEEL, x, -TH - 1.1, 0);
// paint: double yellow centre, white dashed lanes, white edge lines
const PAINT = (c) => new THREE.MeshStandardMaterial({ color: c, roughness: .55, polygonOffset: true, polygonOffsetFactor: -2 });
const strip = (x, z, len, w, c) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(len, w), PAINT(c)); m.rotation.x = -Math.PI / 2; m.position.set(x, .004, z); m.receiveShadow = true; scene.add(m); };
for (const z of [-.12, .12]) strip(0, z, L, .12, '#d9a51c');
for (const z of [-HW + .9, HW - .9]) strip(0, z, L, .14, '#dcdcd6');
for (const z of [-4.5, 4.5]) for (let x = -L / 2 + 1; x < L / 2; x += 12) strip(x + 1.5, z, 3, .13, '#dcdcd6');
// fresh patches (darker, glossier asphalt) where the crew is filling potholes
const PATCH = new THREE.MeshStandardMaterial({ color: '#141516', roughness: .35, polygonOffset: true, polygonOffsetFactor: -3 });
PATCH.color.set('#1b1c1d'); PATCH.roughness = .55; PATCH.map = tex('asphalt_02_diff.jpg', [.5, .5], true); PATCH.normalMap = tex('asphalt_02_nor.jpg', [.5, .5]);
const blob = (s, seed) => { const g = new THREE.CircleGeometry(s, 28), p = g.attributes.position; for (let i = 1; i < p.count; i++) { const a = Math.atan2(p.getY(i), p.getX(i)), k = 1 + .22 * Math.sin(a * 3 + seed) + .12 * Math.sin(a * 7 + seed * 2.3); p.setXY(i, p.getX(i) * k, p.getY(i) * k); } return g; };
for (const [x, z, s] of [[2, 6.3, 1.1], [7.5, 7.2, .8], [-3.5, 6.9, .9]]) { const m = new THREE.Mesh(blob(s, x), PATCH); m.rotation.x = -Math.PI / 2; m.rotation.z = x; m.scale.set(1.3, 1, 1); m.position.set(x, .006, z); m.receiveShadow = true; scene.add(m); }

// ── through-truss: two vertical trusses outside the roadway + overhead bracing ─
const TZ = HW + .9, TOP = 13.5, PAN = 10.5;
function member(a, b, w = .55, d = .7, mat = STEEL) { const v = b.clone().sub(a), len = v.length(); const m = add(new THREE.BoxGeometry(w, len, d), mat); m.position.copy(a).add(b).multiplyScalar(.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), v.normalize()); return m; }
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
for (const s of [-1, 1]) { const z = s * TZ;
  member(V3(-L / 2 - 6, -.6, z), V3(L / 2 + 6, -.6, z), .9, 1.0); member(V3(-L / 2 - 6, TOP, z), V3(L / 2 + 6, TOP, z), 1.0, 1.0);
  for (let x = -L / 2 - 3; x <= L / 2 + 6; x += PAN) { member(V3(x, -.6, z), V3(x, TOP, z), .6, .8); const k = Math.round((x + L / 2 + 3) / PAN) % 2; member(V3(x, k ? -.6 : TOP, z), V3(x + PAN, k ? TOP : -.6, z), .55, .7); } }
for (let x = -L / 2 - 3; x <= L / 2 + 6; x += PAN) { member(V3(x, TOP, -TZ), V3(x, TOP, TZ), .45, .6); member(V3(x, TOP - 2.2, -TZ), V3(x, TOP - .3, -TZ + 2.5), .3, .3); member(V3(x, TOP - 2.2, TZ), V3(x, TOP - .3, TZ - 2.5), .3, .3);
  if (x + PAN <= L / 2 + 6) { member(V3(x, TOP + .1, -TZ), V3(x + PAN, TOP + .1, TZ), .25, .25); member(V3(x, TOP + .1, TZ), V3(x + PAN, TOP + .1, -TZ), .25, .25); } }

// ── models (Poly Haven CC0) ───────────────────────────────────────────────
const GL = new GLTFLoader(); const model = async (id) => { const g = (await GL.loadAsync(A + 'models/' + id + '/' + id + '.gltf')).scene; g.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; } }); return g; };
const [BAR, GEN, SEARCH, BAG, TOOL, LAMP2] = await Promise.all(['concrete_road_barrier', 'portable_generator', 'portable_searchlight', 'cement_bag', 'metal_toolbox', 'street_lamp_02'].map(model));
const fit = (g, axis, size) => { const b = new THREE.Box3().setFromObject(g), s = b.getSize(new THREE.Vector3()); const d = axis === 'max' ? Math.max(s.x, s.y, s.z) : s[axis]; g.scale.multiplyScalar(size / d); return g; };
const place = (src, x, y, z, ry = 0, s) => { const g = src.clone(); if (s) g.scale.copy(s); g.position.set(x, y, z); g.rotation.y = ry; scene.add(g); return g; };
fit(BAR, 'y', .82); const BARR = new THREE.Group(); BARR.add(BAR); { const s0 = new THREE.Box3().setFromObject(BAR).getSize(new THREE.Vector3()); if (s0.z > s0.x) BAR.rotation.y = Math.PI / 2; const b = new THREE.Box3().setFromObject(BARR); BAR.position.y = -b.min.y; BAR.position.x -= (b.min.x + b.max.x) / 2; BAR.position.z -= (b.min.z + b.max.z) / 2; BARR.userData.len = b.getSize(new THREE.Vector3()).x; }
for (const s of [-1, 1]) for (let x = -L / 2 + 1.5; x < L / 2; x += BARR.userData.len + .03) { const g = BARR.clone(); g.position.set(x, 0, s * (HW - .45)); scene.add(g); }
// lamps: davit poles on the barriers every 2 panels, real sodium light
fit(LAMP2, 'y', 11); { const b = new THREE.Box3().setFromObject(LAMP2); LAMP2.userData.dy = -b.min.y; }
const lampHeads = [];
for (const [x, s] of [[-31.5, 1], [10.5, 1], [-10.5, -1], [31.5, -1]]) { const g = place(LAMP2, x, LAMP2.userData.dy + .8, s * (HW - .2), s > 0 ? Math.PI : 0, LAMP2.scale);
  const sp = new THREE.SpotLight('#ffbf7a', 520, 40, 1.0, 1.0, 2); sp.position.set(x, 10.6, s * (HW - 3.2)); sp.target.position.set(x, 0, s * (HW - 6)); sp.castShadow = true; sp.shadow.mapSize.set(1024, 1024); sp.shadow.radius = 10; sp.shadow.blurSamples = 16; sp.shadow.bias = -.0004; scene.add(sp, sp.target); lampHeads.push(sp.position.clone()); }
// work zone in the outer southbound lane (z>0): generator, light tower, bags, toolbox
fit(GEN, 'max', .95); { const b = new THREE.Box3().setFromObject(GEN); place(GEN, -7.5, -b.min.y, 7.6, .4, GEN.scale); }
fit(SEARCH, 'max', 1.3); { const b = new THREE.Box3().setFromObject(SEARCH); place(SEARCH, 11, -b.min.y, 7.9, -2.3, SEARCH.scale); }
fit(BAG, 'max', .62); { const b = new THREE.Box3().setFromObject(BAG); for (const [x, z, ry, y] of [[-5.8, 7.9, .2, 0], [-5.2, 8.0, -.3, 0], [-5.5, 7.95, .9, .17]]) place(BAG, x, -b.min.y + y, z, ry, BAG.scale); }
fit(TOOL, 'max', .55); { const b = new THREE.Box3().setFromObject(TOOL); place(TOOL, 4.8, -b.min.y, 8.1, .5, TOOL.scale); }
const work = new THREE.SpotLight('#fff6ea', 420, 60, .85, 1.0, 2); work.position.set(11.2, 6.5, 8.4); work.target.position.set(1, 0, 6.2); work.castShadow = true; work.shadow.mapSize.set(2048, 2048); work.shadow.radius = 8; work.shadow.blurSamples = 16; work.shadow.bias = -.0003; scene.add(work, work.target);
const lensMat = new THREE.MeshBasicMaterial({ color: new THREE.Color('#fffaf0').multiplyScalar(1.4), toneMapped: false }); add(new THREE.CircleGeometry(.22, 16), lensMat, 11.1, 2.32, 7.75).lookAt(1, 0, 6.2);
// traffic cones closing the lane (orange + 2 retro-reflective collars)
const ORANGE = new THREE.MeshStandardMaterial({ color: '#ff4a0a', roughness: .5 }), REFL = new THREE.MeshStandardMaterial({ color: '#e8e8e4', roughness: .35 }), BASE = new THREE.MeshStandardMaterial({ color: '#141414', roughness: .7 });
const cone = new THREE.Group(); add(new THREE.CylinderGeometry(.03, .16, .72, 20), ORANGE, 0, .4, 0, cone); add(new THREE.CylinderGeometry(.075, .095, .1, 20), REFL, 0, .52, 0, cone); add(new THREE.CylinderGeometry(.115, .132, .09, 20), REFL, 0, .33, 0, cone); add(new THREE.BoxGeometry(.4, .04, .4), BASE, 0, .02, 0, cone);
for (let i = 0; i < 16; i++) { const x = -22 + i * 2.6, z = i < 3 ? 9 - i * .9 : 4.9; const c = cone.clone(); c.position.set(x, 0, z + (i % 2) * .05); c.rotation.y = i; scene.add(c); }
for (let i = 0; i < 4; i++) { const c = cone.clone(); c.position.set(20 + i * 2.2, 0, 4.9 + i * 1.0); scene.add(c); }

// ── people: Mixamo poses → decimated, faceted mannequins; hi-vis vest painted from the spine weights ─
const FIGM = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: .75, envMapIntensity: .6, flatShading: true, vertexColors: true });
FIGM.onBeforeCompile = sh => { sh.fragmentShader = sh.fragmentShader.replace('#include <color_fragment>', `
    float vest = smoothstep(.42, .55, vColor.r); float sp = vColor.g;
    float band = (1. - smoothstep(.0, .025, abs(sp - .30) - .035)) + (1. - smoothstep(.0, .025, abs(sp - .58) - .035)); band = clamp(band, 0., 1.) * vest;
    vec3 base = vec3(.72, .71, .69); vec3 hv = vec3(.55, .72, .08);
    diffuseColor.rgb = mix(mix(base, hv, vest), vec3(.78), band);`); };
const FN = ['Remy_Digging', 'James_Inspect', 'Leonard_Idle', 'Brian_Phone', 'Remy_Crouch'], FG = {};
for (const n of FN) { const g = (await GL.loadAsync(A + 'figs/' + n + '.glb')).scene; let full = null, hands = null; g.traverse(o => { if (o.userData && o.userData.hands) hands = o.userData.hands; if (o.isMesh && o.name === 'full30') full = o; });
  const grp = new THREE.Group(); const m = new THREE.Mesh(full.geometry, FIGM); m.castShadow = m.receiveShadow = true; grp.add(m);
  if (/Dig/.test(n) && hands) { const a = new THREE.Vector3(...hands.RightHand), b = new THREE.Vector3(...hands.LeftHand), dir = b.clone().sub(a).normalize(); const top = a.clone().addScaledVector(dir, -.25), bot = b.clone().addScaledVector(dir, .95);
    const sh = new THREE.Mesh(new THREE.CylinderGeometry(.018, .018, top.distanceTo(bot), 8), new THREE.MeshStandardMaterial({ color: '#5a4630', roughness: .7 })); sh.position.copy(top).add(bot).multiplyScalar(.5); sh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir); sh.castShadow = true; grp.add(sh);
    const bl = new THREE.Mesh(new THREE.BoxGeometry(.24, .3, .02), new THREE.MeshStandardMaterial({ color: '#55595c', roughness: .4, metalness: .8 })); bl.position.copy(bot).addScaledVector(dir, .12); bl.quaternion.copy(sh.quaternion); bl.castShadow = true; grp.add(bl); }
  FG[n] = grp; }
const crew = [['Remy_Digging', 1.6, 6.9, 1.9], ['Remy_Crouch', 7.0, 6.6, -.6], ['Remy_Crouch', -3.2, 7.5, 2.6], ['James_Inspect', -1.0, 6.0, .9], ['Leonard_Idle', 4.6, 5.6, -2.4], ['Brian_Phone', 9.0, 8.4, -1.9], ['Leonard_Idle', -6.4, 6.8, 1.3], ['James_Inspect', 5.0, 7.7, 3.4]];
const people = crew.map(([n, x, z, ry]) => { const g = FG[n].clone(); g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g); return g; });

// ── night light: very low cool moon + sky fill, warm sodium pools, one white work light ─
const moon = new THREE.DirectionalLight('#c9d4e6', 1.1); moon.position.set(-60, 70, -40); moon.castShadow = true; moon.shadow.mapSize.set(4096, 4096); Object.assign(moon.shadow.camera, { left: -50, right: 50, top: 30, bottom: -30, near: 1, far: 250 }); moon.shadow.bias = -.0004; moon.shadow.radius = 14; moon.shadow.blurSamples = 20; scene.add(moon);
scene.add(new THREE.HemisphereLight('#8796a8', '#2b2a28', 1.1));
const glowTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d'), g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.2, 'rgba(255,255,255,.5)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
const glow = new THREE.Points(new THREE.BufferGeometry().setFromPoints(lampHeads.map(p => p.clone().add(V3(0, .15, 0)))), new THREE.PointsMaterial({ map: glowTex, color: new THREE.Color('#ffc080').multiplyScalar(1.0), size: 1.1, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false })); scene.add(glow);

const post = makePost(r, scene, cam, W, H, { ssaa: 1, ao: true, aoAmt: .85, aoRadius: .9, aoScale: 1.3 });
post.bloom.strength = .12; post.bloom.threshold = 1.6; post.vig.uniforms.amt.value = .3; post.vig.uniforms.contrast.value = 0.;
// HUD: Kaktus/Reconstructed-style time chip
const hud = document.createElement('canvas'); hud.width = W; hud.height = H; Object.assign(hud.style, { position: 'fixed', left: 0, top: 0, pointerEvents: 'none' }); document.body.appendChild(hud);
window.shot = (pos, tgt, fov = 30, aper = 2, chip = true) => { cam.position.set(...pos); cam.fov = fov; cam.lookAt(...tgt); cam.updateProjectionMatrix(); post.dof.focus = cam.position.distanceTo(V3(...tgt)); post.dof.aper = aper; post.dof.maxCoc = 8; post.composer.render();
  const x = hud.getContext('2d'); x.clearRect(0, 0, W, H); if (chip) { const k = H / 1080; x.fillStyle = '#fff'; x.font = `700 ${34 * k}px Inter, Helvetica, Arial`; x.fillText('1:24 a.m.', 56 * k, 86 * k); x.font = `400 ${24 * k}px Inter, Helvetica, Arial`; x.fillStyle = '#d6dbe0'; x.fillText('southbound lanes · 8 workers', 56 * k, 122 * k); } return 'ok'; };
window.READY = true;
</script></body></html>
